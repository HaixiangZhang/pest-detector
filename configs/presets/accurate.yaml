# 参数预设: 高精度（慢但召回高）
# 只写要覆盖 configs.yaml 的字段；其余沿用默认值。
# 用法: POST /api/jobs {"source": "...", "mode": "sahi", "preset": "accurate"}
frame_stride: 1              # 逐帧
sahi:
  multi_scale: true          # 多尺度切片（更准更慢）
  conf: 0.55                 # 放宽阈值提高召回
  batch: 4                   # 8GB 显存下多尺度更吃显存，batch 调小
tracker:
  confirm_enabled: true
  confirm_window: 10         # 要求 10 帧窗口内命中 8 帧，压掉闪光误检
  confirm_min_hits: 8