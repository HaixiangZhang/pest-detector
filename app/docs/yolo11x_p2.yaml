# [归档] 训练阶段的 YOLO11x-P2 模型结构定义。
# 训练代码已从本项目移除，部署链路不再引用本文件；仅作结构留档。
#
# YOLO11x-P2 改进模型结构
# 基于 YOLO11x (depth=1.00, width=1.50) + P2 高分辨率检测头
# x-scale 相比 m-scale 提升约 2x 参数量，换取更强的特征提取能力
# 适用于 4K 无人机航拍稻纵卷叶螟小目标检测
#
# 选型（对比 m-scale 0.67/0.75）:
#   - model_size: x
#   - depth_multiple: 1.00（+49%）
#   - width_multiple: 1.50（+100%）
#   - 总参数量约 2x，训练显存需求增加约 50%

nc: 1

# 模型尺寸参数
scales:
  s: [0.50, 0.50, 1024]  # depth, width, max_channels
  m: [0.67, 0.75, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]   # ★ x-scale: 1.5x 宽度，最强特征提取

model_size: x

backbone:
  # 主干网络 - 提取多尺度特征
  # x-scale 下各层通道数 = base × 1.50
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0: P1/2  320x320 (640输入)
  - [-1, 2, C3k2, [128, False]]             # 1:
  - [-1, 1, Conv, [256, 3, 2]]       # 2: P2/4  160x160 (640输入)
  - [-1, 2, C3k2, [256, False]]             # 3:
  - [-1, 1, Conv, [512, 3, 2]]       # 4: P3/8  80x80
  - [-1, 2, C3k2, [512, False]]             # 5:
  - [-1, 1, Conv, [512, 3, 2]]       # 6: P4/16 40x40
  - [-1, 2, C3k2, [512, False]]             # 7:
  - [-1, 1, Conv, [512, 3, 2]]       # 8: P5/32 20x20
  - [-1, 2, C3k2, [512, False]]             # 9:

head:
  # Neck + Head - 特征融合与检测
  # P2 分支: 对第2层(P2/4)进行上采样和特征融合
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10: 上采样 40x40
  - [[-1, 7], 1, Concat, [1]]                     # 11: 与P4特征融合 40x40
  - [-1, 2, C3k2, [512, False]]                          # 12:

  # P3 分支: 继续上采样到 P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13: 上采样 80x80
  - [[-1, 5], 1, Concat, [1]]                     # 14: 与P3特征融合 80x80
  - [-1, 2, C3k2, [256, False]]                          # 15:

  # P2 分支: 上采样到最高分辨率 P2/4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16: 上采样 160x160
  - [[-1, 3], 1, Concat, [1]]                     # 17: 与P2特征融合 160x160
  - [-1, 2, C3k2, [128, False]]                          # 18: P2检测头输出

  # 下采样路径: 从P2返回到P3
  - [-1, 1, Conv, [256, 3, 2]]                    # 19: 下采样到 80x80
  - [[-1, 15], 1, Concat, [1]]                    # 20: 与P3特征融合
  - [-1, 2, C3k2, [256, False]]                          # 21: P3检测头输出

  # 继续下采样到P4
  - [-1, 1, Conv, [512, 3, 2]]                    # 22: 下采样到 40x40
  - [[-1, 12], 1, Concat, [1]]                    # 23: 与P4特征融合
  - [-1, 2, C3k2, [512, False]]                          # 24: P4检测头输出

  # 继续下采样到P5
  - [-1, 1, Conv, [512, 3, 2]]                    # 25: 下采样到 20x20
  - [[-1, 9], 1, Concat, [1]]                     # 26: 与P5特征融合
  - [-1, 2, C3k2, [512, False]]                          # 27: P5检测头输出

# Detect 层: 四层检测头 (P2/P3/P4/P5)
# 对应索引: 18(P2/4), 21(P3/8), 24(P4/16), 27(P5/32)
  - [[18, 21, 24, 27], 1, Detect, [nc]]
